version: '3.8'

services:
  wordpress:
    image: wordpress:latest
    container_name: aqua-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
    volumes:
      # Sincronizar plugin en tiempo real
      - ./aqua-patterns:/var/www/html/wp-content/plugins/aqua-patterns
      # Persistir uploads
      - wordpress_uploads:/var/www/html/wp-content/uploads
      # Persistir base de datos
      - wordpress_data:/var/www/html
    depends_on:
      - db
    networks:
      - aqua-network

  db:
    image: mysql:8.0
    container_name: aqua-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wordpress
      MYSQL_PASSWORD: wordpress
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - aqua-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aqua-phpmyadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: wordpress
      PMA_PASSWORD: wordpress
    depends_on:
      - db
    networks:
      - aqua-network

volumes:
  wordpress_data:
  wordpress_uploads:
  db_data:

networks:
  aqua-network:
    driver: bridge
